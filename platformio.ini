; PlatformIO project — ESP32-WROOM-32E / ESP-IDF
; Native ESP-IDF layout (main/ + root CMakeLists.txt)

[platformio]
src_dir = main
default_envs = esp32-wroom-32e

[env:esp32-wroom-32e]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_upload.flash_size = 4MB

; Optional: uncomment and set your serial port
; upload_port = COM3
; monitor_port = COM3
