; PlatformIO project — ESP32-WROOM-32E / ESP-IDF
; Native ESP-IDF layout (main/ + root CMakeLists.txt)

[platformio]
src_dir = main
default_envs = esp32-wroom-32e

[env:esp32-wroom-32e]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; WROOM-32E module: 4MB flash, no PSRAM
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
; Match factory size in partitions.csv (0x180000 = 1.5MB)
board_upload.maximum_size = 1572864

; Optional: uncomment and set your serial port
; upload_port = COM3
; monitor_port = COM3
